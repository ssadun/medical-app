<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical App — Diseases</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<nav id="sideNav"></nav>
<main>
  <div class="section-head">
    <h2>Diseases</h2>
    <div id="topNav" class="section-actions"></div>
  </div>

  <div class="ctrls">
    <input type="text" id="q" placeholder="Diagnosis, service, doctor..." onkeydown="if(event.key==='Enter')applyFilters()">
    <select id="service"><option value="">All services</option></select>
    <select id="yr"><option value="">All years</option></select>
    <button class="primary" onclick="applyFilters()">Apply</button>
  </div>

  <div class="tbl-wrap">
    <table class="fixed-cols">
      <thead>
        <tr>
          <th id="th-date" style="width:120px;cursor:pointer" onclick="setSort('date')">Date <span id="sort-date"></span></th>
          <th id="th-diagnosis" style="width:260px;cursor:pointer" onclick="setSort('diagnosis')">Diagnosis <span id="sort-diagnosis"></span></th>
          <th id="th-service" style="width:180px;cursor:pointer" onclick="setSort('service')">Service <span id="sort-service"></span></th>
          <th id="th-doctor" style="width:180px;cursor:pointer" onclick="setSort('doctor')">Doctor <span id="sort-doctor"></span></th>
          <th style="width:90px"></th>
        </tr>
      </thead>
      <tbody id="diseasesBody"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</main>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="js/diseases.js"></script>
</body>
</html>
