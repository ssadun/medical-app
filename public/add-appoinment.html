<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical App — Add Appointment</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<nav id="sideNav"></nav>
<main>
  <div class="section-head">
    <h2>Add Appointment</h2>
    <div id="topNav" class="section-actions"></div>
  </div>

  <div class="form-card">
    <h3>New Appointment</h3>
    <div class="grid2">
      <div class="field">
        <label>Date (DD.MM.YYYY) *</label>
        <input type="text" id="a-date" placeholder="e.g. 25.04.2026">
      </div>
      <div class="field">
        <label>Hospital *</label>
        <input type="text" id="a-hospital" list="hospital-list" placeholder="Hospital name">
        <datalist id="hospital-list"></datalist>
      </div>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div class="field">
        <label>Service *</label>
        <input type="text" id="a-service" list="service-list" placeholder="e.g. Cardiology">
        <datalist id="service-list"></datalist>
      </div>
      <div class="field">
        <label>Doctor *</label>
        <input type="text" id="a-doctor" list="doctor-list" placeholder="Doctor name">
        <datalist id="doctor-list"></datalist>
      </div>
    </div>
    <div class="form-actions">
      <button class="primary" onclick="addAppointment()">Save Appointment</button>
      <button onclick="clearAppointmentForm()">Clear</button>
    </div>
    <p id="dup-hint" style="display:none;color:var(--err,#e55);font-size:13px;margin-top:8px">A record with the same date, hospital and doctor already exists.</p>
  </div>
</main>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="js/add-appoinment.js"></script>
</body>
</html>
