services:
  medical-app:
    build: .
    container_name: medical-app
    restart: unless-stopped
    ports:
      - "3234:3234"
    volumes:
      # Mount NAS folder so data persists and is editable outside Docker
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=3234
      - NODE_ENV=production